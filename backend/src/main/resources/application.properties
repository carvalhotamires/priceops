spring.application.name=priceops
server.port=${SERVER_PORT:8080}

# ==========================================
# FONTE DE DADOS (12-Factor App)
# Por padrão em testes/dev local: H2 em memória.
# Em contêiner Docker/produção: PostgreSQL via variáveis de ambiente.
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:priceops_db;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Console Web H2 (ativo em desenvolvimento)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ==========================================
# HIBERNATE / JPA
# O Hibernate 6 autodetecta o dialeto (H2 ou PostgreSQL) a partir do JDBC URL
# ==========================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# ==========================================
# UPLOAD E ARMAZENAMENTO DE ARQUIVOS (US-03 / US-04)
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
priceops.upload.dir=${PRICEOPS_UPLOAD_DIR:uploads/pdfs}
